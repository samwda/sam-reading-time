name: SAM Deploy System

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-plugin:
    name: Deploy Plugin to WP.org
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy plugin to WordPress.org
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: true
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}

      - name: Prepare versioned ZIP
        env:
          ZIP_PATH: ${{ steps.deploy.outputs.zip-path }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          if [ -z "$ZIP_PATH" ] || [ ! -f "$ZIP_PATH" ]; then
            echo "::error::Generated ZIP file not found: $ZIP_PATH"
            exit 1
          fi

          cp "$ZIP_PATH" "sam-reading-time.${VERSION}.zip"

          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

          ls -lh "sam-reading-time.${VERSION}.zip"

      - name: Upload ZIP to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: sam-reading-time.${{ env.VERSION }}.zip
          fail_on_unmatched_files: true
          token: ${{ github.token }}
